<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Konolive — Hors connexion</title>
  <style>
    :root { color-scheme: light; font-family: Inter, Arial, sans-serif; background:#e8edf3; color:#334155; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; box-sizing:border-box; }
    main { max-width:420px; width:100%; text-align:center; background:#e8edf3; border-radius:28px; padding:32px 24px; box-shadow:12px 12px 24px #c6ccd4,-12px -12px 24px #fff; }
    .logo { width:72px; height:72px; margin:0 auto 18px; display:grid; place-items:center; border-radius:22px; background:#df3340; color:#fff; font-size:38px; font-weight:800; box-shadow:6px 6px 12px #c6ccd4,-6px -6px 12px #fff; }
    h1 { margin:0 0 8px; font-size:25px; color:#df3340; }
    p { line-height:1.55; color:#64748b; }
    .card { margin:20px 0; padding:16px; border-radius:16px; background:#e8edf3; box-shadow:inset 4px 4px 8px #cbd1d8,inset -4px -4px 8px #fff; text-align:left; }
    .row { display:flex; justify-content:space-between; margin:8px 0; font-size:14px; }
    button { border:0; border-radius:16px; padding:14px 22px; background:#df3340; color:#fff; font-weight:700; font-size:15px; box-shadow:5px 5px 10px #c6ccd4,-5px -5px 10px #fff; }
    button:active { box-shadow:inset 4px 4px 8px #b92935; }
  </style>
</head>
<body>
  <main>
    <div class="logo">K</div>
    <h1>Konolive</h1>
    <p>Vous êtes hors connexion. Les données déjà consultées restent disponibles localement et les actions seront synchronisées dès le retour du réseau.</p>
    <div class="card">
      <div class="row"><span>Demandes en cache</span><strong id="requests">—</strong></div>
      <div class="row"><span>Notifications en cache</span><strong id="notifications">—</strong></div>
      <div class="row"><span>Actions à synchroniser</span><strong id="pending">—</strong></div>
    </div>
    <button onclick="retry()">Réessayer</button>
  </main>
  <script>
    try {
      var snapshot = JSON.parse(window.AndroidOffline.cachedSnapshot());
      document.getElementById('requests').textContent = snapshot.requests.length;
      document.getElementById('notifications').textContent = snapshot.notifications.length;
      document.getElementById('pending').textContent = snapshot.pendingMutations;
    } catch (e) {}
    function retry() { if (window.AndroidOffline) window.AndroidOffline.retry(); else location.reload(); }
  </script>
</body>
</html>
